<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="respBg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1f6fb2"/>
      <stop offset="100%" stop-color="#144f85"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#respBg2)"/>
  <circle cx="720" cy="80" r="120" fill="#f5a623" opacity="0.15"/>

  <g transform="translate(40,32)">
    <circle cx="12" cy="12" r="12" fill="#f5a623"/>
    <text x="40" y="14" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff">Respira-mol</text>
    <text x="40" y="30" font-family="Arial, sans-serif" font-size="12" fill="#dcecfb">Adherencia al tratamiento</text>
  </g>

  <g transform="translate(60,86)">
    <rect x="0" y="0" width="680" height="440" rx="20" fill="#ffffff"/>
    <text x="36" y="48" font-family="Arial, sans-serif" font-size="21" fill="#0e1b1a">Mayor adherencia con <tspan font-weight="700" fill="#144f85">técnica correcta</tspan></text>

    <g transform="translate(36,80)">
      <text x="0" y="80" font-family="Arial, sans-serif" font-size="76" font-weight="700" fill="#144f85">82%</text>
      <text x="4" y="106" font-family="Arial, sans-serif" font-size="14" fill="#3f524f">de los pacientes mantiene</text>
      <text x="4" y="128" font-family="Arial, sans-serif" font-size="14" fill="#3f524f">la técnica a los 6 meses</text>
    </g>

    <g transform="translate(330,90)">
      <line x1="0" y1="150" x2="310" y2="150" stroke="#dde5e2" stroke-width="2"/>
      <g>
        <rect x="20" y="110" width="46" height="40" rx="6" fill="#dbe6f2"/>
        <text x="43" y="168" font-family="Arial, sans-serif" font-size="11" fill="#3f524f" text-anchor="middle">Sin tto.</text>
        <text x="43" y="102" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#3f524f" text-anchor="middle">14%</text>
      </g>
      <g>
        <rect x="100" y="80" width="46" height="70" rx="6" fill="#9fc3e6"/>
        <text x="123" y="168" font-family="Arial, sans-serif" font-size="11" fill="#3f524f" text-anchor="middle">Comp. A</text>
        <text x="123" y="72" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#3f524f" text-anchor="middle">41%</text>
      </g>
      <g>
        <rect x="180" y="45" width="46" height="105" rx="6" fill="#4f8fc9"/>
        <text x="203" y="168" font-family="Arial, sans-serif" font-size="11" fill="#3f524f" text-anchor="middle">Comp. B</text>
        <text x="203" y="37" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#3f524f" text-anchor="middle">63%</text>
      </g>
      <g>
        <rect x="260" y="0" width="46" height="150" rx="6" fill="#144f85"/>
        <text x="283" y="168" font-family="Arial, sans-serif" font-size="11" font-weight="600" fill="#144f85" text-anchor="middle">Respira-mol</text>
        <text x="283" y="-8" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#144f85" text-anchor="middle">82%</text>
      </g>
    </g>

    <text x="36" y="414" font-family="Arial, sans-serif" font-size="11" fill="#7b8c89">Datos de demostración — reemplazar por resultados del estudio real y su referencia.</text>
  </g>

  <g transform="translate(560,40)">
    <rect x="0" y="0" width="170" height="42" rx="21" fill="#ffffff"/>
    <text x="18" y="27" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#144f85">Ver video</text>
    <text x="146" y="27" font-family="Arial, sans-serif" font-size="15" fill="#144f85">›</text>
  </g>

  <g transform="translate(40,552)" font-family="Arial, sans-serif">
    <text x="0" y="14" font-size="15" font-weight="700" fill="#ffffff" letter-spacing="0.5">LABORATORIO DEMO</text>
    <circle cx="200" cy="8" r="13" fill="#ffffff" opacity="0.9"/>
    <text x="200" y="12" font-size="9" font-weight="700" fill="#144f85" text-anchor="middle">REF</text>
    <circle cx="234" cy="8" r="13" fill="#ffffff" opacity="0.9"/>
    <text x="234" y="12" font-size="9" font-weight="700" fill="#144f85" text-anchor="middle">DEMO</text>
  </g>
