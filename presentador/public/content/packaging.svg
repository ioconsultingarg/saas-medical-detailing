<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="cardioBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d8a78"/>
      <stop offset="100%" stop-color="#0a6b5d"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#cardioBg)"/>
  <path d="M0 480 C160 430 260 540 420 500 C580 460 660 520 800 480 L800 600 L0 600 Z" fill="#cfe94a" opacity="0.9"/>

  <g transform="translate(40,34)">
    <path d="M0 18 C4 4 20 -2 30 6 C22 10 14 16 10 26 C6 20 2 20 0 18 Z" fill="#cfe94a"/>
    <text x="40" y="14" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#ffffff">Demo-molécula</text>
    <text x="40" y="32" font-family="Arial, sans-serif" font-size="13" fill="#d7f3ec">20 mg — comprimidos recubiertos</text>
  </g>

  <text x="40" y="128" font-family="Arial, sans-serif" font-size="30" fill="#ffffff">Un tratamiento <tspan font-weight="700">simple de sostener</tspan></text>

  <!-- numbered journey path -->
  <g transform="translate(60,180)" font-family="Arial, sans-serif">
    <path d="M20 220 C 120 60, 260 60, 340 160 S 520 260, 620 90" fill="none" stroke="#ffffff" stroke-width="3" stroke-dasharray="2 10" opacity="0.6"/>

    <g transform="translate(0,205)">
      <circle r="22" fill="#ffffff"/>
      <text y="6" text-anchor="middle" font-size="18" font-weight="700" fill="#0a6b5d">1</text>
      <text y="46" text-anchor="middle" font-size="14" font-weight="600" fill="#ffffff">1 comprimido</text>
    </g>
    <g transform="translate(320,150)">
      <circle r="22" fill="#ffffff"/>
      <text y="6" text-anchor="middle" font-size="18" font-weight="700" fill="#0a6b5d">2</text>
      <text y="46" text-anchor="middle" font-size="14" font-weight="600" fill="#ffffff">misma hora, cada 12hs</text>
    </g>
    <g transform="translate(600,85)">
      <circle r="22" fill="#cfe94a"/>
      <text y="6" text-anchor="middle" font-size="18" font-weight="700" fill="#0a6b5d">3</text>
      <text y="46" text-anchor="middle" font-size="14" font-weight="600" fill="#ffffff">sin interrupciones</text>
    </g>
  </g>

  <!-- pill nav button (hotspot target) -->
  <g transform="translate(430,300)">
    <rect x="0" y="0" width="220" height="46" rx="23" fill="#0a6b5d"/>
    <text x="20" y="29" font-family="Arial, sans-serif" font-size="15" font-weight="600" fill="#ffffff">Ver posología completa</text>
    <text x="192" y="29" font-family="Arial, sans-serif" font-size="16" fill="#cfe94a">›</text>
  </g>

  <!-- footer brand row -->
  <g transform="translate(40,552)" font-family="Arial, sans-serif">
    <text x="0" y="14" font-size="15" font-weight="700" fill="#ffffff" letter-spacing="0.5">LABORATORIO DEMO</text>
    <circle cx="200" cy="8" r="13" fill="#ffffff" opacity="0.9"/>
    <text x="200" y="12" font-size="9" font-weight="700" fill="#0a6b5d" text-anchor="middle">REF</text>
    <circle cx="234" cy="8" r="13" fill="#ffffff" opacity="0.9"/>
    <text x="234" y="12" font-size="9" font-weight="700" fill="#0a6b5d" text-anchor="middle">DEMO</text>
    <text x="440" y="14" font-size="10" fill="#e4f2ee" opacity="0.85">Contenido de demostración — reemplazar por ficha técnica real.</text>
  </g>
</svg>
