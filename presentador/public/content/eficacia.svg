<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="cardioBg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d8a78"/>
      <stop offset="100%" stop-color="#0a6b5d"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#cardioBg2)"/>
  <circle cx="720" cy="80" r="120" fill="#cfe94a" opacity="0.15"/>

  <g transform="translate(40,32)">
    <path d="M0 18 C4 4 20 -2 30 6 C22 10 14 16 10 26 C6 20 2 20 0 18 Z" fill="#cfe94a"/>
    <text x="40" y="14" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff">Demo-molécula</text>
    <text x="40" y="30" font-family="Arial, sans-serif" font-size="12" fill="#d7f3ec">Estudio de eficacia</text>
  </g>

  <!-- white content card -->
  <g transform="translate(60,86)">
    <rect x="0" y="0" width="680" height="440" rx="20" fill="#ffffff"/>
    <text x="36" y="48" font-family="Arial, sans-serif" font-size="21" fill="#0e1b1a">Reduce el riesgo con <tspan font-weight="700" fill="#0a6b5d">tratamiento continuo</tspan></text>

    <!-- big stat callout -->
    <g transform="translate(36,80)">
      <text x="0" y="80" font-family="Arial, sans-serif" font-size="76" font-weight="700" fill="#0a6b5d">67%</text>
      <text x="4" y="106" font-family="Arial, sans-serif" font-size="14" fill="#3f524f">reducción relativa del riesgo</text>
      <text x="4" y="128" font-family="Arial, sans-serif" font-size="14" fill="#3f524f">vs. placebo a 52 semanas</text>
    </g>

    <!-- comparison bars -->
    <g transform="translate(330,90)">
      <line x1="0" y1="150" x2="310" y2="150" stroke="#dde5e2" stroke-width="2"/>
      <g>
        <rect x="20" y="98" width="46" height="52" rx="6" fill="#dbe8e2"/>
        <text x="43" y="168" font-family="Arial, sans-serif" font-size="11" fill="#3f524f" text-anchor="middle">Placebo</text>
        <text x="43" y="90" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#3f524f" text-anchor="middle">18%</text>
      </g>
      <g>
        <rect x="100" y="70" width="46" height="80" rx="6" fill="#9fcfc6"/>
        <text x="123" y="168" font-family="Arial, sans-serif" font-size="11" fill="#3f524f" text-anchor="middle">Comp. A</text>
        <text x="123" y="62" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#3f524f" text-anchor="middle">34%</text>
      </g>
      <g>
        <rect x="180" y="30" width="46" height="120" rx="6" fill="#6fb6a4"/>
        <text x="203" y="168" font-family="Arial, sans-serif" font-size="11" fill="#3f524f" text-anchor="middle">Comp. B</text>
        <text x="203" y="22" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#3f524f" text-anchor="middle">48%</text>
      </g>
      <g>
        <rect x="260" y="0" width="46" height="150" rx="6" fill="#0a6b5d"/>
        <text x="283" y="168" font-family="Arial, sans-serif" font-size="11" font-weight="600" fill="#0a6b5d" text-anchor="middle">Demo-mol</text>
        <text x="283" y="-8" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#0a6b5d" text-anchor="middle">67%</text>
      </g>
    </g>

    <text x="36" y="414" font-family="Arial, sans-serif" font-size="11" fill="#7b8c89">Datos de demostración — reemplazar por resultados del estudio clínico real y su referencia.</text>
  </g>

  <!-- pill nav button (hotspot target) -->
  <g transform="translate(560,40)">
    <rect x="0" y="0" width="170" height="42" rx="21" fill="#ffffff"/>
    <text x="18" y="27" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#0a6b5d">Ver video</text>
    <text x="146" y="27" font-family="Arial, sans-serif" font-size="15" fill="#0a6b5d">›</text>
  </g>

  <!-- footer brand row -->
  <g transform="translate(40,552)" font-family="Arial, sans-serif">
    <text x="0" y="14" font-size="15" font-weight="700" fill="#ffffff" letter-spacing="0.5">LABORATORIO DEMO</text>
    <circle cx="200" cy="8" r="13" fill="#ffffff" opacity="0.9"/>
    <text x="200" y="12" font-size="9" font-weight="700" fill="#0a6b5d" text-anchor="middle">REF</text>
    <circle cx="234" cy="8" r="13" fill="#ffffff" opacity="0.9"/>
    <text x="234" y="12" font-size="9" font-weight="700" fill="#0a6b5d" text-anchor="middle">DEMO</text>
  </g>
</svg>
