    <script>
      // el tema se resuelve antes del primer pintado: oscuro salvo que la persona haya elegido claro
      (function () {
        var t = 'oscuro'
        try {
          if (localStorage.getItem('io-pharma-tema') === 'claro') t = 'claro'
        } catch (e) {}
        document.documentElement.dataset.tema = t
        document.documentElement.style.colorScheme = t === 'oscuro' ? 'dark' : 'light'
      })()
    </script>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
